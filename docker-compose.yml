services:
  tierras:
    build: .
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      HOST: 0.0.0.0
      DB_PATH: /app/data/tierras.db
      SEED_DEMO: 'false'
      # Activar cuando haya un proxy con HTTPS delante.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      APP_URL: "${APP_URL:-http://127.0.0.1:3001}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      EMAIL_WEBHOOK_URL: "${EMAIL_WEBHOOK_URL:-}"
      EMAIL_WEBHOOK_TOKEN: "${EMAIL_WEBHOOK_TOKEN:-}"
    volumes:
      - tierras-data:/app/data

volumes:
  tierras-data:
